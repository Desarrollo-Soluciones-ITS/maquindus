services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Maquindus}
      APP_ENV: production
      APP_DEBUG: false
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-maquindus}
      DB_USERNAME: ${DB_USERNAME:-maquindus}
      DB_PASSWORD: ${DB_PASSWORD}

      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database

      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${APP_NAME:-Maquindus}

      FILESYSTEM_DISK: local
    volumes:
      - storage_data:/var/www/html/storage/app
      - logs_data:/var/www/html/storage/logs
    ports:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maquindus.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.maquindus.entrypoints=websecure"
      - "traefik.http.routers.maquindus.tls.certresolver=letsencrypt"
      - "traefik.http.services.maquindus.loadbalancer.server.port=80"
    networks:
      - app_network

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-maquindus}
      MYSQL_USER: ${DB_USERNAME:-maquindus}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network

volumes:
  mysql_data:
  storage_data:
  logs_data:

networks:
  app_network:
    driver: bridge