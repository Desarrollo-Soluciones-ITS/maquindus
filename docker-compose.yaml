services:

  # ─────────────────────────────────────────────────────────
  # Laravel App (PHP-FPM + Nginx + Queue + Scheduler)
  # ─────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Maquindus}
      APP_ENV: production
      APP_DEBUG: false
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-maquindus}
      DB_USERNAME: ${DB_USERNAME:-maquindus}
      DB_PASSWORD: ${DB_PASSWORD}

      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}

      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis

      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${APP_NAME:-Maquindus}

      FILESYSTEM_DISK: local
    volumes:
      - storage_data:/var/www/html/storage/app
      - logs_data:/var/www/html/storage/logs
    ports:
      - "80"                 # Dokploy/Traefik expone este puerto automáticamente
    labels:
      # Traefik labels — Dokploy los gestiona, ajusta el host según tu dominio
      - "traefik.enable=true"
      - "traefik.http.routers.maquindus.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.maquindus.entrypoints=websecure"
      - "traefik.http.routers.maquindus.tls.certresolver=letsencrypt"
      - "traefik.http.services.maquindus.loadbalancer.server.port=80"
    networks:
      - app_network

  # ─────────────────────────────────────────────────────────
  # MySQL 8
  # ─────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-maquindus}
      MYSQL_USER: ${DB_USERNAME:-maquindus}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network

  # ─────────────────────────────────────────────────────────
  # Redis (cache, sessions, queue)
  # ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app_network

volumes:
  mysql_data:
  redis_data:
  storage_data:
  logs_data:

networks:
  app_network:
    driver: bridge